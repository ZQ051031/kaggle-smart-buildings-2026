name: Synthetic tests and submission freshness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check sbctl train tools tests/test_notebook.py tests/fixtures
      - run: python -m pytest -q
        env:
          SB_STARTER_KIT: /nonexistent-starter-kit
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - run: python tools/build_notebook.py --check
